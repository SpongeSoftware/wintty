name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc.1) to publish a release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test wintty.sln -c Release -p:Version=${{ steps.ver.outputs.version }}
      - name: Publish
        run: >
          dotnet publish src/Wintty.App/Wintty.App.csproj -c Release
          -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} --self-contained
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/wintty-${{ matrix.arch }}
      - name: Zip
        shell: pwsh
        run: |
          $name = "wintty-${{ steps.ver.outputs.version }}-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path artifacts/wintty-${{ matrix.arch }}/* -DestinationPath "artifacts/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: wintty-${{ matrix.arch }}
          path: |
            artifacts/*.zip
            artifacts/wintty-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Derive version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Collect zips
        run: mkdir -p out && find dist -name '*.zip' -exec cp {} out/ \;
      - name: Checksums
        run: cd out && sha256sum *.zip > SHA256SUMS.txt
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOMs
        run: |
          for arch in x64 arm64; do
            syft "dir:dist/wintty-$arch/wintty-$arch" \
              -o spdx-json="out/wintty-${{ steps.ver.outputs.version }}-win-$arch.spdx.json" \
              -o cyclonedx-json="out/wintty-${{ steps.ver.outputs.version }}-win-$arch.cdx.json"
          done
      - name: Release notes and changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Generate winget manifests
        run: |
          python3 scripts/make-winget-manifest.py \
            --version "${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --sums out/SHA256SUMS.txt \
            --out out/winget
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.pre }}
          files: |
            out/*.zip
            out/*.json
            out/SHA256SUMS.txt
            out/winget/*
