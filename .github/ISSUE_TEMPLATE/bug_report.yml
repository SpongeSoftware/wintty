name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: wintty version }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Windows version and architecture }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: Include the shell and program you were running. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual behaviour }
    validations: { required: true }
